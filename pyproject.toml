[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-churn-intelligence"
version = "1.0.0"
description = "End-to-end telco churn, ARPU & KPI forecasting with PyTorch, MLOps and Streamlit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3", "numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "scikit-learn>=1.4",
  "statsmodels>=0.14.2", "plotly>=5.22", "streamlit>=1.50", "pyyaml>=6.0", "joblib>=1.3",
]

[project.scripts]
telco-train = "telco.pipelines.train:main"
telco-monitor = "telco.pipelines.monitor:main"
telco-predict = "telco.pipelines.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "app"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"app/**" = ["E402", "I001"]
